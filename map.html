<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAKER — Map</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f10;--surface:rgba(26,26,29,.92);--surface2:#222226;
  --border:#2e2e34;--accent:#7c6af7;--accent-dim:#3d3578;
  --text:#e8e6f0;--muted:#7a7880;--green:#4ade80;--red:#f87171;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);font-family:var(--sans);overflow:hidden}

/* ── MAP ── */
#map{width:100%;height:100%;background:var(--bg)}

/* ── Leaflet overrides ── */
.leaflet-container{background:#0f0f10;font-family:var(--sans)}
.leaflet-control-zoom{border:1px solid var(--border)!important;background:var(--surface)!important;backdrop-filter:blur(12px);border-radius:6px!important;overflow:hidden}
.leaflet-control-zoom a{background:transparent!important;color:var(--muted)!important;border-color:var(--border)!important;font-size:16px!important;width:28px!important;height:28px!important;line-height:28px!important;transition:all .15s}
.leaflet-control-zoom a:hover{color:var(--text)!important;background:rgba(124,106,247,.12)!important}
.leaflet-bar{border:none!important}
.leaflet-popup-content-wrapper{background:var(--surface)!important;border:1px solid var(--border)!important;border-radius:8px!important;box-shadow:0 8px 24px rgba(0,0,0,.6)!important;backdrop-filter:blur(16px);color:var(--text)!important;font-family:var(--mono)!important;font-size:11px!important}
.leaflet-popup-tip{background:var(--surface)!important;border:1px solid var(--border)!important}
.leaflet-popup-close-button{color:var(--muted)!important;font-size:16px!important}
.leaflet-popup-close-button:hover{color:var(--text)!important}
.leaflet-control-attribution{background:rgba(15,15,16,.7)!important;color:#4a4850!important;font-size:9px!important;border-radius:4px 0 0 0!important;backdrop-filter:blur(8px)}
.leaflet-control-attribution a{color:#5a5870!important}

/* ── TOP BAR ── */
#top-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 10px;backdrop-filter:blur(16px);box-shadow:0 4px 20px rgba(0,0,0,.5);max-width:calc(100vw - 40px)}
#search-input{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:11px;width:220px;padding:2px 4px}
#search-input::placeholder{color:var(--muted)}
#search-btn{background:var(--accent);border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:12px;padding:4px 10px;font-family:var(--mono);font-size:10px;transition:background .15s;white-space:nowrap}
#search-btn:hover{background:#9585ff}
.top-sep{width:1px;height:16px;background:var(--border);flex-shrink:0}
#loc-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;font-size:13px;padding:3px 8px;transition:all .15s;white-space:nowrap}
#loc-btn:hover{border-color:var(--accent);color:var(--text)}
#loc-btn.active{border-color:var(--green);color:var(--green)}

/* ── BOTTOM STATUS ── */
#status-strip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 14px;backdrop-filter:blur(16px);font-family:var(--mono);font-size:10px;color:var(--muted);display:none;align-items:center;gap:8px;max-width:calc(100vw - 40px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status-strip.visible{display:flex}
#status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:spulse 1.5s ease-in-out infinite}
@keyframes spulse{0%,100%{opacity:1}50%{opacity:.3}}
#status-txt{overflow:hidden;text-overflow:ellipsis}

/* ── ROUTE LEGEND ── */
#route-legend{position:absolute;bottom:10px;right:10px;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;backdrop-filter:blur(16px);font-family:var(--mono);font-size:10px;color:var(--muted);display:none;min-width:160px}
#route-legend.visible{display:block}
.rl-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rl-row:last-child{margin-bottom:0}
.rl-line{width:18px;height:3px;border-radius:2px;flex-shrink:0}
.rl-clear{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:9px;padding:3px 8px;margin-top:8px;width:100%;transition:all .15s}
.rl-clear:hover{border-color:var(--red);color:var(--red)}

/* ── CUSTOM MARKERS ── */
.baker-pin{width:10px;height:10px;border-radius:50%;border:2px solid;box-shadow:0 0 8px currentColor}
.baker-pin.you{background:var(--green);border-color:var(--green);box-shadow:0 0 12px var(--green)}
.baker-pin.dest{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--accent)}
.baker-pin.drop{background:var(--amber,#fbbf24);border-color:var(--amber,#fbbf24)}
</style>
</head>
<body>

<div id="map"></div>

<!-- Search / locate bar -->
<div id="top-bar">
  <input id="search-input" placeholder="Search or say "fly to…"" type="text">
  <button id="search-btn" onclick="doSearch()">Go</button>
  <div class="top-sep"></div>
  <button id="loc-btn" onclick="locateMe()" title="My location">⌖ Me</button>
</div>

<!-- Status strip -->
<div id="status-strip">
  <div id="status-dot"></div>
  <span id="status-txt">Ready</span>
</div>

<!-- Route legend -->
<div id="route-legend">
  <div class="rl-row"><div class="rl-line" style="background:#7c6af7;box-shadow:0 0 4px #7c6af7"></div><span id="rl-from">You</span></div>
  <div class="rl-row"><div class="rl-line" style="background:#4ade80;box-shadow:0 0 4px #4ade80"></div><span id="rl-to">Destination</span></div>
  <button class="rl-clear" onclick="clearRoute()">✕ Clear route</button>
</div>

<script>
// ── Init map ────────────────────────────────────────────────
var map = L.map('map', {
  center: [39.8283, -98.5795], // center of US as fallback
  zoom: 4,
  zoomControl: true,
  attributionControl: true,
});

// Dark tile layer — CartoDB Dark Matter
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

// ── State ───────────────────────────────────────────────────
var myLat = null, myLng = null;
var myMarker = null;
var destMarker = null;
var routeLine = null;
var glowLine = null;
var droppedMarkers = [];

// ── Custom icon factory ─────────────────────────────────────
function makeIcon(cls) {
  return L.divIcon({
    className: '',
    html: '<div class="baker-pin ' + cls + '"></div>',
    iconSize: [10, 10],
    iconAnchor: [5, 5],
    popupAnchor: [0, -8],
  });
}

// ── Status ──────────────────────────────────────────────────
function setStatus(txt, persist) {
  var strip = document.getElementById('status-strip');
  var el = document.getElementById('status-txt');
  el.textContent = txt;
  strip.classList.add('visible');
  if (!persist) setTimeout(function() { strip.classList.remove('visible'); }, 3500);
}

// ── Geocode (Nominatim) ─────────────────────────────────────
async function geocode(query) {
  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);
  var r = await fetch(url, { headers: { 'Accept-Language': 'en', 'User-Agent': 'BAKER-App' } });
  var data = await r.json();
  if (!data || !data.length) return null;
  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), name: data[0].display_name.split(',').slice(0, 2).join(', ') };
}

// ── Fly to ──────────────────────────────────────────────────
async function flyTo(query) {
  setStatus('Finding ' + query + '…', true);
  var result = await geocode(query);
  if (!result) { setStatus('Could not find: ' + query); return null; }
  map.flyTo([result.lat, result.lng], 13, { animate: true, duration: 1.4 });
  if (destMarker) map.removeLayer(destMarker);
  destMarker = L.marker([result.lat, result.lng], { icon: makeIcon('dest') })
    .addTo(map)
    .bindPopup('<b>' + result.name + '</b>')
    .openPopup();
  setStatus('Flew to ' + result.name);
  return result;
}

// ── Drop pin ────────────────────────────────────────────────
function dropPin(lat, lng, label) {
  var m = L.marker([lat, lng], { icon: makeIcon('drop') })
    .addTo(map)
    .bindPopup(label || ('Pin: ' + lat.toFixed(4) + ', ' + lng.toFixed(4)));
  droppedMarkers.push(m);
  map.flyTo([lat, lng], 14, { animate: true, duration: 1.2 });
  setStatus('Pin dropped');
}

// ── Directions (glowing line) ───────────────────────────────
async function directionsTo(query) {
  if (myLat === null) {
    setStatus('Getting your location first…', true);
    await new Promise(function(res) { locateMe(res); });
    if (myLat === null) { setStatus('Location unavailable'); return; }
  }
  setStatus('Routing to ' + query + '…', true);
  var result = await geocode(query);
  if (!result) { setStatus('Could not find: ' + query); return; }

  // Remove old route
  clearRoute(true);

  // Destination marker
  if (destMarker) map.removeLayer(destMarker);
  destMarker = L.marker([result.lat, result.lng], { icon: makeIcon('dest') })
    .addTo(map)
    .bindPopup('<b>' + result.name + '</b>');

  var coords = [[myLat, myLng], [result.lat, result.lng]];

  // Try OSRM for a real road route
  try {
    var osrmUrl = 'https://router.project-osrm.org/route/v1/driving/' +
      myLng + ',' + myLat + ';' + result.lng + ',' + result.lat +
      '?overview=full&geometries=geojson';
    var rr = await fetch(osrmUrl);
    var rd = await rr.json();
    if (rd.routes && rd.routes[0]) {
      var pts = rd.routes[0].geometry.coordinates.map(function(c) { return [c[1], c[0]]; });
      coords = pts;
      var dist = (rd.routes[0].distance / 1000).toFixed(1);
      var dur = Math.round(rd.routes[0].duration / 60);
      document.getElementById('rl-from').textContent = 'You → ' + result.name;
      document.getElementById('rl-to').textContent = dist + ' km · ~' + dur + ' min';
    }
  } catch(e) { /* fallback to straight line */ }

  // Glow line (outer, wider, dimmer)
  glowLine = L.polyline(coords, {
    color: '#7c6af7',
    weight: 8,
    opacity: 0.18,
    lineJoin: 'round',
    lineCap: 'round',
  }).addTo(map);

  // Main route line
  routeLine = L.polyline(coords, {
    color: '#7c6af7',
    weight: 2.5,
    opacity: 0.85,
    lineJoin: 'round',
    lineCap: 'round',
    dashArray: null,
  }).addTo(map);

  // Fit bounds with padding
  map.fitBounds(L.latLngBounds([[myLat, myLng], [result.lat, result.lng]]).pad(0.25), { animate: true, duration: 1.2 });
  document.getElementById('route-legend').classList.add('visible');
  document.getElementById('rl-from').textContent = 'You → ' + result.name.split(',')[0];
  setStatus('Route to ' + result.name.split(',')[0]);
}

function clearRoute(silent) {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if (glowLine)  { map.removeLayer(glowLine);  glowLine  = null; }
  if (destMarker){ map.removeLayer(destMarker); destMarker = null; }
  document.getElementById('route-legend').classList.remove('visible');
  if (!silent) setStatus('Route cleared');
}

// ── My Location ─────────────────────────────────────────────
function locateMe(cb) {
  var btn = document.getElementById('loc-btn');
  btn.textContent = '⌖ …';
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      myLat = pos.coords.latitude;
      myLng = pos.coords.longitude;
      if (myMarker) map.removeLayer(myMarker);
      myMarker = L.marker([myLat, myLng], { icon: makeIcon('you') })
        .addTo(map)
        .bindPopup('<b>You are here</b>');
      map.flyTo([myLat, myLng], 14, { animate: true, duration: 1.2 });
      btn.textContent = '⌖ Me';
      btn.classList.add('active');
      setStatus('Location found');
      if (cb) cb();
    },
    function(err) {
      btn.textContent = '⌖ Me';
      setStatus('Location denied');
      if (cb) cb();
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ── Search bar ──────────────────────────────────────────────
function doSearch() {
  var q = document.getElementById('search-input').value.trim();
  if (q) flyTo(q);
}
document.getElementById('search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});

// ── Click to drop pin ────────────────────────────────────────
map.on('contextmenu', function(e) {
  dropPin(e.latlng.lat, e.latlng.lng, 'Dropped pin');
});

// ── postMessage API (called from hud.html) ──────────────────
// Commands: {cmd:'flyTo', query:'...'} | {cmd:'directionsTo', query:'...'} |
//           {cmd:'dropPin', lat, lng, label} | {cmd:'locate'} | {cmd:'clearRoute'}
window.addEventListener('message', async function(e) {
  if (!e.data || typeof e.data !== 'object') return;
  var d = e.data;
  switch (d.cmd) {
    case 'flyTo':        await flyTo(d.query); break;
    case 'directionsTo': await directionsTo(d.query); break;
    case 'dropPin':      dropPin(d.lat, d.lng, d.label); break;
    case 'locate':       locateMe(); break;
    case 'clearRoute':   clearRoute(); break;
  }
  // Notify parent of result
  if (e.source) e.source.postMessage({ type: 'mapReady' }, '*');
});

// ── Auto-locate on load ──────────────────────────────────────
window.addEventListener('load', function() {
  locateMe();
});
</script>
</body>
</html>
