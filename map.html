<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAKER — Map</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f10;--surface:rgba(22,22,25,.95);--border:#2e2e34;
  --accent:#7c6af7;--text:#e8e6f0;--muted:#7a7880;--green:#4ade80;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);font-family:var(--sans);overflow:hidden}
#map{width:100%;height:100%;background:var(--bg)}

/* Leaflet dark overrides */
.leaflet-container{background:#0d0d0f;font-family:var(--sans)}
.leaflet-control-zoom{border:1px solid var(--border)!important;background:var(--surface)!important;backdrop-filter:blur(12px);border-radius:6px!important;overflow:hidden}
.leaflet-control-zoom a{background:transparent!important;color:var(--muted)!important;border-color:var(--border)!important;font-size:16px!important;width:28px!important;height:28px!important;line-height:28px!important;transition:all .15s}
.leaflet-control-zoom a:hover{color:var(--text)!important;background:rgba(124,106,247,.12)!important}
.leaflet-bar{border:none!important}
.leaflet-popup-content-wrapper{background:var(--surface)!important;border:1px solid var(--border)!important;border-radius:8px!important;box-shadow:0 8px 24px rgba(0,0,0,.6)!important;backdrop-filter:blur(16px);color:var(--text)!important;font-family:var(--mono)!important;font-size:11px!important;padding:8px 12px!important}
.leaflet-popup-content{margin:0!important;line-height:1.5}
.leaflet-popup-tip{background:var(--surface)!important}
.leaflet-popup-close-button{color:var(--muted)!important;font-size:16px!important;top:4px!important;right:6px!important}
.leaflet-popup-close-button:hover{color:var(--text)!important}
.leaflet-control-attribution{background:rgba(13,13,15,.8)!important;color:#3a3850!important;font-size:9px!important;border-radius:4px 0 0 0!important}
.leaflet-control-attribution a{color:#4a4870!important}

/* Top search bar */
#top-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px 8px;backdrop-filter:blur(16px);box-shadow:0 4px 24px rgba(0,0,0,.6);max-width:calc(100vw - 24px);width:360px}
#search-input{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:11px;flex:1;padding:2px 4px;min-width:0}
#search-input::placeholder{color:var(--muted)}
#search-btn{background:var(--accent);border:none;border-radius:5px;color:#fff;cursor:pointer;font-family:var(--mono);font-size:10px;padding:4px 10px;transition:background .15s;white-space:nowrap;flex-shrink:0}
#search-btn:hover{background:#9585ff}
.sep{width:1px;height:14px;background:var(--border);flex-shrink:0}
#loc-btn{background:none;border:1px solid var(--border);border-radius:5px;color:var(--muted);cursor:pointer;font-size:11px;padding:3px 8px;transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:var(--mono)}
#loc-btn:hover{border-color:var(--accent);color:var(--text)}
#loc-btn.active{border-color:var(--green);color:var(--green)}

/* Status strip */
#status-strip{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 14px;backdrop-filter:blur(16px);font-family:var(--mono);font-size:10px;color:var(--muted);display:none;align-items:center;gap:7px;max-width:calc(100vw - 24px);white-space:nowrap}
#status-strip.vis{display:flex}
#sdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:dp 1.5s ease-in-out infinite}
@keyframes dp{0%,100%{opacity:1}50%{opacity:.25}}
#stxt{overflow:hidden;text-overflow:ellipsis}

/* Route info panel */
#route-info{position:absolute;bottom:34px;right:10px;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;backdrop-filter:blur(16px);font-family:var(--mono);font-size:10px;color:var(--muted);display:none;min-width:170px;line-height:1.8}
#route-info.vis{display:block}
#ri-dest{color:var(--text);font-size:11px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ri-stats{color:var(--accent)}
.ri-btn{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:9px;padding:3px 8px;margin-top:7px;width:100%;transition:all .15s}
.ri-btn:hover{border-color:#f87171;color:#f87171}

/* Custom markers via divIcon */
.bpin{width:12px;height:12px;border-radius:50%;border:2px solid;position:relative}
.bpin.you{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.2),0 0 12px rgba(74,222,128,.5)}
.bpin.dest{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,106,247,.2),0 0 12px rgba(124,106,247,.5)}
.bpin.drop{background:#fbbf24;border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.2)}
</style>
</head>
<body>
<div id="map"></div>

<div id="top-bar">
  <input id="search-input" type="text" placeholder='Search or "fly to…"'>
  <button id="search-btn" onclick="doSearch()">Go</button>
  <div class="sep"></div>
  <button id="loc-btn" onclick="locateMe()">⌖ Me</button>
</div>

<div id="status-strip"><div id="sdot"></div><span id="stxt"></span></div>

<div id="route-info">
  <div id="ri-dest">Route</div>
  <div id="ri-stats"></div>
  <button class="ri-btn" onclick="clearRoute()">✕ Clear route</button>
</div>

<script>
// ── Map init ─────────────────────────────────────────────────
var map = L.map('map',{center:[39.83,-98.58],zoom:4,zoomControl:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; <a href="https://openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com">CARTO</a>',
  subdomains:'abcd',maxZoom:19
}).addTo(map);

// ── State ────────────────────────────────────────────────────
var myLat=null,myLng=null;
var myMarker=null,destMarker=null;
var routeLine=null,glowLine=null;
var drops=[];
var ready=false; // signals to parent that map is fully loaded

// ── Icons ─────────────────────────────────────────────────────
function icon(cls){
  return L.divIcon({className:'',html:'<div class="bpin '+cls+'"></div>',iconSize:[12,12],iconAnchor:[6,6],popupAnchor:[0,-10]});
}

// ── Status ────────────────────────────────────────────────────
var _stTimer=null;
function setStatus(txt,persist){
  document.getElementById('stxt').textContent=txt;
  document.getElementById('status-strip').classList.add('vis');
  clearTimeout(_stTimer);
  if(!persist)_stTimer=setTimeout(()=>document.getElementById('status-strip').classList.remove('vis'),4000);
}
function clearStatus(){
  clearTimeout(_stTimer);
  document.getElementById('status-strip').classList.remove('vis');
}

// ── Geocode (Nominatim) ───────────────────────────────────────
async function geocode(q){
  try{
    var url='https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q);
    var r=await fetch(url,{headers:{'Accept-Language':'en','User-Agent':'BAKER-HUD/1.0'}});
    var d=await r.json();
    if(!d||!d.length)return null;
    return{lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon),name:d[0].display_name.split(',').slice(0,2).join(', ')};
  }catch(e){return null;}
}

// ── Fly to ────────────────────────────────────────────────────
async function flyTo(q){
  setStatus('Finding '+q+'…',true);
  var r=await geocode(q);
  if(!r){setStatus('Not found: '+q);return;}
  if(destMarker){map.removeLayer(destMarker);destMarker=null;}
  destMarker=L.marker([r.lat,r.lng],{icon:icon('dest')}).addTo(map).bindPopup('<b>'+r.name+'</b>').openPopup();
  map.flyTo([r.lat,r.lng],13,{animate:true,duration:1.4});
  setStatus(r.name);
}

// ── Directions ───────────────────────────────────────────────
async function directionsTo(q){
  // Get location if we don't have it
  if(myLat===null){
    setStatus('Getting your location…',true);
    await new Promise(function(res){
      navigator.geolocation.getCurrentPosition(
        function(p){myLat=p.coords.latitude;myLng=p.coords.longitude;placeMyMarker();res();},
        function(){res();},
        {enableHighAccuracy:true,timeout:12000}
      );
    });
  }
  if(myLat===null){setStatus('Location unavailable — allow GPS and try again');return;}

  setStatus('Finding '+q+'…',true);
  var dest=await geocode(q);
  if(!dest){setStatus('Not found: '+q);return;}

  clearRoute(true);
  if(destMarker){map.removeLayer(destMarker);destMarker=null;}
  destMarker=L.marker([dest.lat,dest.lng],{icon:icon('dest')}).addTo(map).bindPopup('<b>'+dest.name+'</b>').openPopup();

  setStatus('Drawing route…',true);

  // Try OSRM — if CORS blocked, fall back to straight line
  var coords=[[myLat,myLng],[dest.lat,dest.lng]];
  var distKm=null,durMin=null;

  try{
    var osrm='https://router.project-osrm.org/route/v1/driving/'+myLng+','+myLat+';'+dest.lng+','+dest.lat+'?overview=full&geometries=geojson';
    var rr=await fetch(osrm);
    if(rr.ok){
      var rd=await rr.json();
      if(rd.routes&&rd.routes[0]){
        coords=rd.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
        distKm=(rd.routes[0].distance/1000).toFixed(1);
        durMin=Math.round(rd.routes[0].duration/60);
      }
    }
  }catch(e){/* CORS or network — use straight line */}

  // Draw glow layer first, then the solid line on top
  glowLine=L.polyline(coords,{color:'#7c6af7',weight:14,opacity:0.12,lineJoin:'round',lineCap:'round'}).addTo(map);
  routeLine=L.polyline(coords,{color:'#7c6af7',weight:3,opacity:0.9,lineJoin:'round',lineCap:'round'}).addTo(map);

  // Fit both points in view
  var bounds=L.latLngBounds([[myLat,myLng],[dest.lat,dest.lng]]);
  map.fitBounds(bounds.pad(0.3),{animate:true,duration:1.2});

  // Route info panel
  var ri=document.getElementById('route-info');
  var shortName=dest.name.split(',')[0];
  document.getElementById('ri-dest').textContent='→ '+shortName;
  document.getElementById('ri-stats').textContent=distKm?distKm+' km · ~'+durMin+' min':'Straight line (GPS route unavailable)';
  ri.classList.add('vis');
  setStatus('Route to '+shortName);
}

// ── Clear route ───────────────────────────────────────────────
function clearRoute(silent){
  if(routeLine){map.removeLayer(routeLine);routeLine=null;}
  if(glowLine){map.removeLayer(glowLine);glowLine=null;}
  if(destMarker){map.removeLayer(destMarker);destMarker=null;}
  document.getElementById('route-info').classList.remove('vis');
  if(!silent)setStatus('Route cleared');
}

// ── My Location ───────────────────────────────────────────────
function placeMyMarker(){
  if(!myLat)return;
  if(myMarker){map.removeLayer(myMarker);}
  myMarker=L.marker([myLat,myLng],{icon:icon('you')}).addTo(map).bindPopup('<b>You are here</b>');
  document.getElementById('loc-btn').classList.add('active');
}
function locateMe(){
  var btn=document.getElementById('loc-btn');
  btn.textContent='⌖ …';
  setStatus('Locating…',true);
  navigator.geolocation.getCurrentPosition(
    function(p){
      myLat=p.coords.latitude;myLng=p.coords.longitude;
      placeMyMarker();
      map.flyTo([myLat,myLng],14,{animate:true,duration:1.2});
      btn.textContent='⌖ Me';
      setStatus('Located');
    },
    function(){btn.textContent='⌖ Me';setStatus('Location denied');},
    {enableHighAccuracy:true,timeout:12000}
  );
}

// ── Drop pin ──────────────────────────────────────────────────
function dropPin(lat,lng,label){
  var m=L.marker([lat,lng],{icon:icon('drop')}).addTo(map).bindPopup(label||'Pin');
  drops.push(m);
  map.flyTo([lat,lng],14,{animate:true,duration:1.0});
  setStatus('Pin dropped');
}

// ── Search bar ────────────────────────────────────────────────
function doSearch(){
  var q=document.getElementById('search-input').value.trim();
  if(q)flyTo(q);
}
document.getElementById('search-input').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});
map.on('contextmenu',function(e){dropPin(e.latlng.lat,e.latlng.lng,'Dropped pin');});

// ── postMessage API ───────────────────────────────────────────
window.addEventListener('message',async function(e){
  if(!e.data||typeof e.data!=='object')return;
  switch(e.data.cmd){
    case 'flyTo':        await flyTo(e.data.query);break;
    case 'directionsTo': await directionsTo(e.data.query);break;
    case 'dropPin':      dropPin(e.data.lat,e.data.lng,e.data.label);break;
    case 'locate':       locateMe();break;
    case 'clearRoute':   clearRoute();break;
  }
  // ACK back to parent
  try{window.parent.postMessage({type:'mapAck',cmd:e.data.cmd},'*');}catch(err){}
});

// ── Signal ready to parent ────────────────────────────────────
// Tell parent window the map is loaded and accepting messages
function signalReady(){
  ready=true;
  try{window.parent.postMessage({type:'mapReady'},'*');}catch(err){}
}

// Auto-locate and signal ready
window.addEventListener('load',function(){
  signalReady();
  locateMe();
});
</script>
</body>
</html>
